<title>小学语文乐学 · 统编版三年级</title>
<style>

  body{margin:0;font-family:"PingFang SC","Microsoft YaHei","STKaiti","KaiTi",serif;background:linear-gradient(160deg,#fff5e6 0%,#ffe8cc 100%);color:var(--ink);min-height:100vh;user-select:none}
  .wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}
  h1{font-size:22px;margin:0;letter-spacing:1px}
  .stars{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);font-weight:700;color:var(--primary-d)}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .btn{border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:#fff;cursor:pointer;transition:transform .08s;width:100%}
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--primary)}.btn-blue{background:var(--blue)}.btn-green{background:var(--green)}.btn-purple{background:var(--purple)}.btn-pink{background:var(--pink)}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid-modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mode{border-radius:20px;padding:22px 16px;color:#fff;cursor:pointer;text-align:center;box-shadow:var(--shadow);transition:transform .08s}
  .mode:active{transform:scale(.96)}
  .mode .emoji{font-size:46px;display:block;margin-bottom:8px}
  .mode .t{font-size:18px;font-weight:800}
  .mode .d{font-size:12px;opacity:.9;margin-top:4px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{background:#fff;border:none;border-radius:12px;padding:10px 14px;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
  .title-sm{font-size:18px;font-weight:800}
  .flash{text-align:center;padding:28px 16px}
  .flash .zi{font-size:120px;font-weight:800;color:var(--primary-d);line-height:1;font-family:"STKaiti","KaiTi","Songti SC",serif;margin-bottom:8px}
  .flash .py{font-size:30px;color:var(--blue);font-weight:600;margin-bottom:10px;letter-spacing:2px}
  .flash .ci{font-size:22px;color:#555;margin-bottom:6px}
  .flash .yi{font-size:14px;color:var(--muted)}
  .speak{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:16px;font-weight:700;cursor:pointer}
  .progress{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}
  .opt{background:#fff;border:3px solid #ffe0c2;border-radius:16px;padding:18px;font-size:22px;font-weight:700;cursor:pointer;text-align:center;transition:.12s}
  .opt:active{transform:scale(.97)}
  .opt.right{background:#e7f9eb;border-color:var(--green);color:#2b8a3e}
  .opt.wrong{background:#ffe9ec;border-color:var(--pink);color:#c92a52}
  .q-pic{text-align:center;font-size:90px;font-weight:800;color:var(--primary-d);margin:10px 0 16px;font-family:"STKaiti","KaiTi",serif}
  .q-prompt{text-align:center;font-size:18px;font-weight:700;margin-bottom:14px}
  .toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:#fff;border-radius:20px;padding:24px 32px;box-shadow:0 12px 40px rgba(0,0,0,.2);font-size:48px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;top:32%}
  .done{text-align:center;padding:24px}.done .big{font-size:72px}.done .msg{font-size:22px;font-weight:800;margin:10px 0}
  .combo{position:fixed;top:70px;right:16px;background:var(--pink);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;box-shadow:var(--shadow);transform:scale(0);transition:.2s;z-index:40}.combo.show{transform:scale(1)}
  .bar{height:10px;background:#ffe0c2;border-radius:999px;overflow:hidden;margin:12px 0}.bar>i{display:block;height:100%;background:var(--green);width:100%;transition:width .2s linear}
  .unit-row{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:16px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
  .unit-row:active{transform:scale(.99)}
  .unit-row .n{font-weight:800;font-size:17px}.unit-row .c{font-size:13px;color:var(--muted)}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
  .poem{font-family:"STKaiti","KaiTi","Songti SC",serif;text-align:center;padding:16px 0}
  .poem .pt{font-size:26px;font-weight:800;color:var(--primary-d);margin-bottom:6px}
  .poem .pa{font-size:14px;color:var(--muted);margin-bottom:18px}
  .poem .pl{font-size:22px;color:#333;line-height:2;letter-spacing:2px}
  .poem .pl.blank{color:#fff;background:#ffe0c2;border-radius:8px;padding:0 12px;display:inline-block}
  .dictate-card{text-align:center;padding:40px 16px}
  .dictate-card .speak-big{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:20px 36px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
  .dictate-card .reveal{font-size:64px;font-weight:800;color:var(--primary-d);font-family:"STKaiti",serif;margin:12px 0 6px}
  .dictate-card .py{font-size:22px;color:var(--blue);letter-spacing:2px;margin-bottom:8px}
</style>

function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function ymd(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function parseDay(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({key:ymd(d),dow:'日一二三四五六'[d.getDay()]})}return a}

function saveLog(){localStorage.setItem('c_log',JSON.stringify(LOG));localStorage.setItem('c_wrong',JSON.stringify(WRONG))}
function dayBucket(d){d=d||todayStr();if(!LOG[d])LOG[d]={time:{},correct:0,total:0};return LOG[d]}
let _act=null;
function startActivity(m){endActivity();_act={mode:m,t0:Date.now()}}
function endActivity(){if(!_act)return;const ms=Date.now()-_act.t0;if(ms>=1000){const b=dayBucket();b.time[_act.mode]=(b.time[_act.mode]||0)+ms;saveLog()}_act=null}
document.addEventListener('visibilitychange',()=>{if(document.hidden)endActivity()});
window.addEventListener('pagehide',endActivity);
function logResult(c,t){const b=dayBucket();b.correct+=c;b.total+=t;saveLog()}
function logWrong(q){if(!q||!q.key)return;if(!WRONG[q.key])WRONG[q.key]={key:q.key,z:q.z,p:q.p,w:q.w,type:q.type,count:0,last:''};WRONG[q.key].count++;WRONG[q.key].last=todayStr();saveLog()}
function answeredRight(q){if(q&&q.key&&WRONG[q.key]){WRONG[q.key].count=Math.max(0,WRONG[q.key].count-1);if(WRONG[q.key].count===0)delete WRONG[q.key];saveLog()}}
function fmtMs(ms){const s=Math.round(ms/1000);if(s<60)return s+'秒';const m=Math.floor(s/60);return m+'分'+(s%60?(s%60)+'秒':'')}

let actx=null;function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function beep(fs,dur=.12,t='sine'){const c=ac();if(!c)return;fs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(c.destination);const tt=c.currentTime+i*dur*.9;g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.25,tt+.02);g.gain.exponentialRampToValueAtTime(.0001,tt+dur);o.start(tt);o.stop(tt+dur)})}
const sfxRight=()=>beep([660,880],.12),sfxWrong=()=>beep([200,150],.18,'square'),sfxWin=()=>beep([523,659,784,1047],.14);

      <div class="yi">${w.m}</div>
      <div><button class="speak">🔊 听发音</button></div>
      <div class="progress">${i+1} / ${ws.length}</div>
    </div>`);
    card.querySelector('.speak').onclick=()=>speak(w.z+'，'+w.w);
    app.appendChild(card);
    app.appendChild($(`<div class="grid2">
      <button class="btn btn-ghost" id="prev">‹ 上一个</button>
      <button class="btn btn-primary" id="next">下一个 ›</button></div>`));
    app.querySelector('#prev').onclick=()=>{if(i>0){i--;render()}};
    app.querySelector('#next').onclick=()=>{if(i<ws.length-1){i++;render();speak(ws[i].z+'，'+ws[i].w)}else finish()};
    speak(w.z+'，'+w.w);
  }
  function finish(){
    addStar(3);endActivity();sfxWin();
    app.innerHTML='';
    app.appendChild($(`<div class="card done"><div class="big">🎉</div><div class="msg">这组生字看完啦！+3⭐</div></div>`));

    app.querySelector('#again').onclick=()=>{i=0;startActivity('zishi');render()};
    app.querySelector('#bk').onclick=home;
  }
  render();
}

function startPinyin(){
  startActivity('pinyin');
  const qs=shuffle(ZISHI).slice(0,12);
  let idx=0,correct=0;
  function render(){
    const w=qs[idx];
    const mode=Math.random()<0.5?'z2p':'p2z';   // 字→拼音 / 拼音→字
    const others=shuffle(ZISHI.filter(x=>x.z!==w.z)).filter((x,i,a)=>{
      // 去重显示
      const key=mode==='z2p'?'p':'z';
      return a.findIndex(y=>y[key]===x[key])===i;
    }).slice(0,3);
    const opts=shuffle([w,...others]);
    app.innerHTML='';
    app.appendChild($(`<div class="topbar"><button class="back">← 返回</button><div class="title-sm">拼音练习 (${idx+1}/${qs.length})</div></div>`));
    app.querySelector('.back').onclick=()=>{endActivity();home()};
    const promptHtml=mode==='z2p'
      ?`<div class="q-pic">${w.z}</div><div class="q-prompt">这个字的<b>拼音</b>是？</div>`
      :`<div class="q-pic" style="color:var(--blue);font-family:sans-serif;font-size:60px;">${w.p}</div><div class="q-prompt">这个拼音对应哪个<b>字</b>？</div>`;
    const card=$(`<div class="card">${promptHtml}</div>`);
    const grid=$(`<div class="grid2"></div>`);
    opts.forEach(o=>{
      const label=mode==='z2p'?o.p:o.z;
      const right=mode==='z2p'?o.p===w.p:o.z===w.z;
      const b=$(`<div class="opt">${label}</div>`);
      b.onclick=()=>{
        if(b.dataset.done)return;
        grid.querySelectorAll('.opt').forEach(x=>x.dataset.done='1');
        if(right){
          b.classList.add('right');correct++;addStar(1);sfxRight();comboHit();toast('⭐');speak(w.z);
          answeredRight({key:'py:'+w.z,z:w.z,p:w.p,w:w.w,type:'pinyin'});
        }else{
          b.classList.add('wrong');sfxWrong();comboReset();toast('🤔');
          logWrong({key:'py:'+w.z,z:w.z,p:w.p,w:w.w,type:'pinyin'});
          const want=mode==='z2p'?w.p:w.z;
          grid.querySelectorAll('.opt').forEach(x=>{if(x.textContent===want)x.classList.add('right')});
          speak(w.z);
        }
        setTimeout(()=>{if(idx<qs.length-1){idx++;render()}else finish()},1100);
      };
      grid.appendChild(b);
    });
    card.appendChild(grid);
    app.appendChild(card);
  }
  function finish(){
    logResult(correct,qs.length);endActivity();sfxWin();
    const pass=correct>=Math.ceil(qs.length*0.6);
    app.innerHTML='';
    app.appendChild($(`<div class="card done"><div class="big">${pass?'🏆':'💪'}</div><div class="msg">答对 ${correct}/${qs.length}<br>获得 ${correct}⭐</div></div>`));

    app.appendChild($(`<div style="height:12px"></div>`));
    app.appendChild($(`<button class="btn btn-ghost" id="bk">回首页</button>`));
    app.querySelector('#again').onclick=()=>{idx=0;correct=0;startActivity('pinyin');render()};
    app.querySelector('#bk').onclick=home;
  }

}

function startPoem(){

}
function poemDetail(idx){
  startActivity('poem');
  const p=POEMS[idx];
  app.innerHTML='';
  app.appendChild($(`<div class="topbar"><button class="back">← 返回</button><div class="title-sm">${p.t}</div></div>`));
  app.querySelector('.back').onclick=()=>{endActivity();startPoem()};
  const card=$(`<div class="card poem">
    <div class="pt">${p.t}</div>
    <div class="pa">${p.a}</div>
    <div>${p.lines.map(l=>`<div class="pl">${l}</div>`).join('')}</div>
  </div>`);

  app.querySelector('#read').onclick=()=>speak(p.t+'，'+p.a+'。'+p.lines.join(''));
  app.querySelector('#fill').onclick=()=>startPoemFill(idx);
  setTimeout(()=>speak(p.t+'，'+p.a+'。'+p.lines.join('')),300);
}
function startPoemFill(idx){
  const p=POEMS[idx];
  let li=0,correct=0;
  function render(){
    if(li>=p.lines.length){finish();return}
    const line=p.lines[li];
    // 干扰句：从其他古诗里随机抽 3 句长度相近的
    const allLines=POEMS.flatMap(po=>po.lines).filter(l=>l!==line);
    const others=shuffle(allLines).slice(0,3);
    const opts=shuffle([line,...others]);
    app.innerHTML='';
    app.appendChild($(`<div class="topbar"><button class="back">← 返回</button><div class="title-sm">${p.t} · 填空 (${li+1}/${p.lines.length})</div></div>`));
    app.querySelector('.back').onclick=()=>{endActivity();poemDetail(idx)};
    const lines=p.lines.map((l,i)=>i===li?`<div class="pl blank">_____________</div>`:`<div class="pl">${l}</div>`).join('');
    const card=$(`<div class="card poem"><div class="pt">${p.t}</div><div class="pa">${p.a}</div><div>${lines}</div></div>`);
    app.appendChild(card);
    app.appendChild($(`<div class="q-prompt">填空处是哪一句？</div>`));
    const grid=$(`<div></div>`);
    opts.forEach(o=>{
      const b=$(`<div class="opt" style="font-family:'STKaiti',serif;margin-bottom:10px;font-size:20px;">${o}</div>`);
      b.onclick=()=>{
        if(b.dataset.done)return;
        grid.querySelectorAll('.opt').forEach(x=>x.dataset.done='1');
        const wrong={key:'po:'+p.t+'-'+li,z:p.t,p:line,w:p.t+' 填空',type:'poem'};
        if(o===line){
          b.classList.add('right');correct++;addStar(2);sfxRight();comboHit();toast('⭐');speak(line);
          answeredRight(wrong);
        }else{
          b.classList.add('wrong');sfxWrong();comboReset();toast('🤔');logWrong(wrong);
          grid.querySelectorAll('.opt').forEach(x=>{if(x.textContent===line)x.classList.add('right')});
          speak(line);
        }
        setTimeout(()=>{li++;render()},1500);
      };
      grid.appendChild(b);
    });
    app.appendChild(grid);
  }
  function finish(){
    logResult(correct,p.lines.length);endActivity();sfxWin();
    app.innerHTML='';
    const pass=correct===p.lines.length;
    app.appendChild($(`<div class="card done"><div class="big">${pass?'🏆':'📜'}</div><div class="msg">${p.t} · 填对 ${correct}/${p.lines.length}<br>获得 ${correct*2}⭐</div></div>`));
    app.appendChild($(`<button class="btn btn-primary" id="again">再背一遍</button>`));
    app.appendChild($(`<div style="height:12px"></div>`));
    app.appendChild($(`<button class="btn btn-ghost" id="bk">回首页</button>`));
    app.querySelector('#again').onclick=()=>{li=0;correct=0;startActivity('poem');render()};
    app.querySelector('#bk').onclick=home;
  }
  startActivity('poem');render();
}

/* ============================================================
   模式4：词语听写（家长辅助模式）
   App 念词 → 孩子在纸上写 → 点"看答案"自查 → 标记对错
   ============================================================ */
function startDictate(){
  startActivity('dictate');
  const ws=shuffle(ZISHI).slice(0,10);
  let idx=0,correct=0;
  function render(){
    const w=ws[idx];
    let revealed=false;
    app.innerHTML='';
    app.appendChild($(`<div class="topbar"><button class="back">← 返回</button><div class="title-sm">词语听写 (${idx+1}/${ws.length})</div></div>`));
    app.querySelector('.back').onclick=()=>{endActivity();home()};
    const card=$(`<div class="card dictate-card">
      <div style="font-size:14px;color:#8a8a8a;margin-bottom:14px;">先在纸上写下你听到的词，再点"看答案"自查</div>
      <button class="speak-big" id="play">🔊 点这里听</button>
      <div id="ansArea" style="margin-top:24px;"></div>
    </div>`);
    app.appendChild(card);
    const playBtn=card.querySelector('#play'), ansArea=card.querySelector('#ansArea');
    playBtn.onclick=()=>speak(w.w,.7);   // 听写放慢
    setTimeout(()=>speak(w.w,.7),300);   // 进卡自动读一遍

    function reveal(){
      revealed=true;
      ansArea.innerHTML=`<div class="reveal">${w.w}</div><div class="py">${w.p}</div>
        <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-green" style="width:auto;padding:10px 24px;" id="ok">✅ 我写对了</button>
          <button class="btn btn-pink" style="width:auto;padding:10px 24px;" id="ng">❌ 我写错了</button>
        </div>`;
      ansArea.querySelector('#ok').onclick=()=>{
        correct++;addStar(2);sfxRight();comboHit();toast('⭐');
        answeredRight({key:'dt:'+w.w,z:w.z,p:w.p,w:w.w,type:'dictate'});
        setTimeout(next,500);
      };
      ansArea.querySelector('#ng').onclick=()=>{
        sfxWrong();comboReset();toast('💪');
        logWrong({key:'dt:'+w.w,z:w.z,p:w.p,w:w.w,type:'dictate'});
        setTimeout(next,500);
      };
    }
    app.appendChild($(`<button class="btn btn-primary" id="reveal" style="margin-top:8px;">👀 看答案</button>`));
    app.querySelector('#reveal').onclick=()=>{ if(!revealed) reveal(); };
    function next(){ if(idx<ws.length-1){idx++;render()}else finish() }
  }
  function finish(){
    logResult(correct,ws.length);endActivity();sfxWin();
    app.innerHTML='';
    const pass=correct>=Math.ceil(ws.length*0.6);
    app.appendChild($(`<div class="card done"><div class="big">${pass?'🏆':'💪'}</div><div class="msg">听写完成！写对 ${correct}/${ws.length}<br>获得 ${correct*2}⭐</div></div>`));
    app.appendChild($(`<button class="btn btn-primary" id="again">再听写一组</button>`));
    app.appendChild($(`<div style="height:12px"></div>`));
    app.appendChild($(`<button class="btn btn-ghost" id="bk">回首页</button>`));
    app.querySelector('#again').onclick=()=>{idx=0;correct=0;startActivity('dictate');render()};
    app.querySelector('#bk').onclick=home;
  }
  render();
}

function reportPage(){
  endActivity();
  app.innerHTML='';
  app.appendChild($(`<div class="topbar"><button class="back">← 返回</button><div class="title-sm">📊 学习报告</div></div>`));
  app.querySelector('.back').onclick=home;
  const today=todayStr();
  const tB=LOG[today]||{time:{},correct:0,total:0};
  const todayMs=Object.values(tB.time).reduce((a,b)=>a+b,0);
  let allMs=0,allCorrect=0,allTotal=0;
  Object.values(LOG).forEach(d=>{allMs+=Object.values(d.time||{}).reduce((a,b)=>a+b,0);allCorrect+=d.correct||0;allTotal+=d.total||0});
  const todayAcc=tB.total?Math.round(tB.correct/tB.total*100):null;
  const allAcc=allTotal?Math.round(allCorrect/allTotal*100):null;
  const activeDays=Object.keys(LOG).length;
  const todayModes=Object.keys(tB.time).sort((a,b)=>tB.time[b]-tB.time[a]);
  const modeRows=todayModes.length?todayModes.map(m=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee;"><span>${MODE_NAME[m]||m}</span><b>${fmtMs(tB.time[m])}</b></div>`).join(''):'<div style="color:#8a8a8a;padding:6px 0;">今天还没开始学，去读个字吧～</div>';
  app.appendChild($(`<div class="card">
    <div class="title-sm" style="margin-bottom:8px;">📅 今天 (${today})</div>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <div style="flex:1;background:#ffe8cc;border-radius:14px;padding:12px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#c9450c;">${fmtMs(todayMs)}</div><div style="font-size:12px;color:#8a8a8a;">学习时长</div></div>
      <div style="flex:1;background:#e7f5ff;border-radius:14px;padding:12px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#1971c2;">${todayAcc!==null?todayAcc+'%':'—'}</div><div style="font-size:12px;color:#8a8a8a;">答题正确率</div></div>
      <div style="flex:1;background:#ebfbee;border-radius:14px;padding:12px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#2b8a3e;">${tB.total||0}</div><div style="font-size:12px;color:#8a8a8a;">做题数</div></div>
    </div>
    <div style="font-size:14px;font-weight:700;margin:6px 0 2px;">各模块用时：</div>${modeRows}
  </div>`));
  app.appendChild($(`<div class="card"><div class="title-sm" style="margin-bottom:8px;">📈 累计</div>
    <div style="font-size:14px;line-height:2;color:#555;">
      🔥 连续打卡 <b>${streak}</b> 天 ｜ 学习过 <b>${activeDays}</b> 天<br>
      ⏱️ 总学习时长 <b>${fmtMs(allMs)}</b><br>
      🎯 总答题 <b>${allTotal}</b> 道 ｜ 平均正确率 <b>${allAcc!==null?allAcc+'%':'—'}</b><br>
      ⭐ 总星星 <b>${stars}</b>
    </div></div>`));
  // 趋势
  const days=last7();
  const dayMins=days.map(d=>{const t=(LOG[d.key]&&Object.values(LOG[d.key].time||{}).reduce((a,b)=>a+b,0))||0;return Math.round(t/60000*10)/10});
  const maxMin=Math.max(1,...dayMins);
  const learnedDays=dayMins.filter(m=>m>0).length;
  const bars=days.map((d,i)=>{const h=Math.max(4,Math.round(dayMins[i]/maxMin*90));const on=dayMins[i]>0;return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="font-size:10px;color:#8a8a8a;height:14px;">${on?dayMins[i]+'分':''}</div><div style="width:60%;height:${h}px;border-radius:6px 6px 0 0;background:${on?'linear-gradient(180deg,#e8590c,#ffc078)':'#eee'};"></div><div style="font-size:11px;color:${d.key===today?'#c9450c':'#8a8a8a'};font-weight:${d.key===today?800:400};">周${d.dow}</div></div>`}).join('');
  app.appendChild($(`<div class="card"><div class="title-sm" style="margin-bottom:10px;">📊 近 7 天学习趋势</div><div style="display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px;">${bars}</div><div style="font-size:13px;color:#8a8a8a;margin-top:8px;">最近 7 天里坚持学习了 <b style="color:#c9450c;">${learnedDays}</b> 天</div></div>`));
  // 历史
  const allDates=Object.keys(LOG).sort((a,b)=>parseDay(b)-parseDay(a));
  const histCard=$(`<div class="card"><div class="title-sm" style="margin-bottom:10px;">🗂️ 历史记录（点某天看明细）</div></div>`);
  if(!allDates.length){histCard.appendChild($(`<div style="color:#8a8a8a;padding:6px 0;">还没有历史记录，学起来吧～</div>`))}
  else{
    const wrap=$(`<div></div>`);
    allDates.forEach(dt=>{
      const b=LOG[dt];const ms=Object.values(b.time||{}).reduce((a,x)=>a+x,0);
      const acc=b.total?Math.round(b.correct/b.total*100):null;
      const dow='日一二三四五六'[parseDay(dt).getDay()];
      const isToday=dt===today;
      const row=$(`<div class="unit-row" style="cursor:pointer;"><div><div class="n">${dt}${isToday?' <span style="color:#c9450c;font-size:12px;">今天</span>':''} <span style="color:#aaa;font-size:12px;">周${dow}</span></div><div class="c">⏱️ ${fmtMs(ms)} ｜ 🎯 ${acc!==null?acc+'%':'—'} ｜ ${b.total||0}题</div></div><div>›</div></div>`);
      row.onclick=()=>dayDetailPage(dt);
      wrap.appendChild(row);
    });
    histCard.appendChild(wrap);
  }
  app.appendChild(histCard);
  // 错字本
  const wrongList=Object.values(WRONG).sort((a,b)=>b.count-a.count);
  const wrongCard=$(`<div class="card"><div class="title-sm" style="margin-bottom:10px;">📕 错字/错题本（点可听发音）</div></div>`);
  if(!wrongList.length){wrongCard.appendChild($(`<div style="color:#2b8a3e;padding:6px 0;">🎉 太棒了，目前没有需要复习的错字！</div>`))}
  else{
    const wrap=$(`<div></div>`);
    wrongList.forEach(w=>{
      const row=$(`<div class="unit-row" style="cursor:pointer;"><div><div class="n">📝 ${w.z||w.w} <span style="color:#1971c2;font-size:14px;">${w.p||''}</span></div><div class="c">${w.w||''} · ${MODE_NAME[w.type]||w.type}</div></div><div style="color:#c92a52;font-weight:800;">错${w.count}次 🔊</div></div>`);
      row.onclick=()=>speak(w.z||w.w);
      wrap.appendChild(row);
    });
    wrongCard.appendChild(wrap);
    const reviewBtn=$(`<button class="btn" style="background:var(--pink);margin-top:14px;">🎯 专项练习这 ${wrongList.length} 个错字</button>`);
    reviewBtn.onclick=startReview;
    wrongCard.appendChild(reviewBtn);
  }
  app.appendChild(wrongCard);
  // 总结
  let tips=[];
  if(todayMs===0) tips.push('今天还没开始，建议先做 5 分钟「生字认读」热热身。');
  else tips.push(`今天已学习 ${fmtMs(todayMs)}，做了 ${tB.total||0} 道题${todayAcc!==null?('，正确率 '+todayAcc+'%'):''}。`);
  if(todayAcc!==null){
    if(todayAcc>=90) tips.push('正确率很高，挑战「古诗填空」试试看。');
    else if(todayAcc>=60) tips.push('掌握得不错，重点把错字本里的字再过一遍。');
    else tips.push('错得有点多，建议放慢节奏，多用「生字认读」打基础。');
  }
  if(wrongList.length) tips.push('最需要复习：'+wrongList.slice(0,5).map(w=>(w.z||w.w)).join('、')+'。');
  app.appendChild($(`<div class="card" style="background:linear-gradient(135deg,#fff,#ffe8cc);"><div class="title-sm" style="margin-bottom:8px;">📝 今日总结</div><div style="font-size:14px;line-height:1.9;color:#444;">${tips.map(t=>'· '+t).join('<br>')}</div></div>`));
  // 清空门
  app.appendChild($(`<div style="text-align:center;margin-top:14px;"><button id="clr" style="background:none;border:none;color:#c9c9c9;font-size:12px;text-decoration:underline;cursor:pointer;padding:8px;">清空学习记录（需家长验证）</button></div>`));
  app.querySelector('#clr').onclick=()=>{
    const ans=prompt('⚠️ 清空后所有学习记录和错字本将永久无法恢复！\n\n如确定要清空，请一字不差输入：\n\n确认清空');
    if(ans===null)return;
    if((ans||'').trim()==='确认清空'){LOG={};WRONG={};saveLog();toast('🗑️ 已清空',1200);reportPage()}
    else alert('输入不一致，已取消清空（记录安全）。');
  };
}

/* ============================================================
   首页
   ============================================================ */
function home(){
  endActivity();
  footHint.innerHTML='提示：第一次点发音可能没声音，再点一次即可。';
  app.innerHTML='';
  if(isNewCheckIn){isNewCheckIn=false;addStar(3);setTimeout(()=>toast('🎁 打卡+3⭐',1200),300)}
  const li=levelInfo();
  const banner=$(`<div class="card" style="background:linear-gradient(135deg,#fff,#ffe8cc);cursor:pointer;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><div style="font-size:20px;font-weight:800;">${li.emoji} Lv.${li.lv} ${li.title}</div>
      <div style="font-size:13px;color:#8a8a8a;margin-top:4px;">🔥 连续打卡 <b>${streak}</b> 天 ｜ 累计 <b>${totalDays}</b> 天 ｜ ⭐ ${stars}</div></div>
      <div style="font-size:40px;">${li.emoji}</div>
    </div>
    <div class="bar" style="margin:12px 0 4px;"><i style="width:${li.pct}%;background:linear-gradient(90deg,#e8590c,#ffc078);"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#8a8a8a;">${li.next!==null?('再得 '+(li.next-stars)+' ⭐ 升下一级'):'已满级，太厉害啦！👑'}</span>
      <span style="font-size:13px;font-weight:700;color:#c9450c;">📊 学习报告 ›</span>
    </div></div>`);
  banner.onclick=reportPage;
  app.appendChild(banner);
  app.appendChild($(`<div class="card">
    <div class="title-sm" style="margin-bottom:14px;">选一个玩法 👇</div>
    <div class="grid-modes">
      <div class="mode btn-primary" data-go="zishi"><span class="emoji">📚</span><div class="t">生字认读</div><div class="d">字+拼音+词+释义</div></div>
      <div class="mode btn-blue" data-go="pinyin"><span class="emoji">🔤</span><div class="t">拼音练习</div><div class="d">字↔拼音 双向考</div></div>
      <div class="mode" style="background:linear-gradient(135deg,#9775fa,#4dabf7);" data-go="poem"><span class="emoji">📜</span><div class="t">古诗背诵</div><div class="d">课内8首+填空</div></div>
      <div class="mode btn-green" data-go="dictate"><span class="emoji">✍️</span><div class="t">词语听写</div><div class="d">家长辅助 · 自查</div></div>
    </div></div>`));
  app.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick=()=>{
      const m=el.dataset.go;
      if(m==='zishi')startZishi();
      else if(m==='pinyin')startPinyin();
      else if(m==='poem')startPoem();
      else if(m==='dictate')startDictate();
    };
  });
}

home();
</script>
</body>
</html>
